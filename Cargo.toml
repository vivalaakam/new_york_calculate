[package]
name = "new_york_calculate_core"
version = "0.0.71"
authors = ["Andrey Makarov <viva.la.akam@gmail.com>"]
edition = "2024"
description = "Library for calculation some things"
license = "MIT"
resolver = "2"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
tracing-instrument = []

[dependencies]
thiserror = "2.0.20"
tracing = "0.1.44"
uuid = { version = "1.24", features = ["v4"] }

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
tracing-subscriber = "0.3.23"

[[bench]]
name = "calculate_bench"
harness = false

[lib]
name = "new_york_calculate_core"
